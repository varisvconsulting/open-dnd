"properties":
  name: "General properties"
  description: "General properties apply to weapons at all times."
  list:
    - "Agile": "The weapon scales with DEX instead of STR"
    - "Balanced": "The weapon can scale with either STR or DEX"
    - "Light": "The weapon can be used for off-hand attacks without incuring disadvantage on its attacks."
    - "Effort": "The weapon applies the wielders CON bonus to damage and block DC."
    - "Glove": >-
        The weapon leaves the hand free to grasp, but cannot be used while wielding or holding another
        object or creature.
    - "Ignite": >-
        The weapon can be ignited as an action, burning for the next half hour if two-handed, or 10 minutes
        if one-handed. An ignited weapon provides mild light and applies extra fire damage to attacks,
        as indicated next to the ability. Each attack reduces the duration the weapon remains ignited
        by 1 minute.
    - "Inaccurate": "The weapons attacks incur disadvantage if the wielder has moved since the start of their turn."
    - "Very Inaccurate": >-
        The weapons attacks incur disadvantage if the wielder has moved since the start of their previous
        turn.
    - "Reach I/II/III": "The weapons melee range is increased by 5/10/15ft, respectively."
    - "Swift": >-
        You can perform a single attack with this weapon as a bonus action. For versatile weapons, requires
        wielding the weapon in both hands.
    - "Throw": >-
        The weapon can be thrown at the associated range as a ranged attack. Unlike baseline ranged weapon
        attacks, a thrown weapon attack does not incur disadvantage in melee range.
    - "Tool": >-
        The weapon provides a +1 bonus to non-combat checks made that include using the weapon appropriately
        for its purpose(Subject to GM.)
    - "Two-handed": >-
        The weapon requires 2 hands to wield. Most 2 handed weapons can be set aside while still holding
        them in order to interact with nearby objects with 1 hand.
    - "Unwieldy": >-
        This weapon treats a natural 2 as a critical failure. Follows mono '+' notation, indicating a
        further critical failure range increase by 1 per '+'.
    - "Versatile": "This weapon has a two-handed version."
    - "Breach": >-
        Requires an extra instance of block to negate this weapons attacks (or more, if + or ++ are present
        afterwards.)
    - "Cleave": >-
        This weapons attack can be made to target two adjacent creatures within range. In such cases,
        the attack targets both characters AC, and permits both to block. This is treated as a single
        attack.
    - "Impale": >-
        This weapons attacks, like cleave, can be made to two adjacent targets, up to the weapons reach.
        The targets must be in a straight outgoing line.
    - "DC": >-
        This weapons block DC is altered. Follows "+"/"-" notation, increasing/decreasing the block DC
        of the weapon.

"ranged properties":
  "Arc": "This weapons attacks can ignore half-cover."
  "Reload": >-
    Once this weapon is fired, it must be reloaded. The amount it takes depends on the severity of the
    reload: I   - any action(bonus, move, or action.) II  - action, OR bonus + move action. III - action.
    IV  - 2 of any action(action, bonus action, or move action.) V   - full round action.
  "Capacity": >-
    Indicates that the weapon uses a capacity ammo system. The weapon has a maximum ammo, as indicated
    after the keyword(ex: 'capacity 3') and each ammunition is loaded individually. May be preceded by
    cartridge (ex: 'cartridge capacity') meaning that the weapons ammo is reloaded all at once instead,
    but thus requires a prepared cartridge(or similar) item for it.
  "Bolt DC": >-
    Reloading the weapon requires making a STR check vs a given DC. +1 weapons and higher reduce the DC
    by their bonus. Failing the bolt DC check results in wasting the reload actions.
  "Launcher": >-
    The weapon can be used to fire potions and minor objects, roughly equivalent to a potion or slingstone,
    instead of standard ammunition. If a range is given, then it overrides the ranged weapons range for
    this action.
  "Overdraw": "The weapons attacks apply STR to the damage dealt."

# CORE WORDS
"core words:":
  description: >-
    A core word describes the core `Attack` used as a maneuver, and is the 'bound attack' that the following
    conditional sequences, properties, and modifiers apply to. If by some means, a property is applied
    before a bound attack, that property is stored and applies to the next core word in the maneuver.
    Core words that are chained by a preceeding '>' means that they must target the same target as the
    previous core word.
  list:
    - "Attack": >-
        Make an attack. May be followed by properties and modifiers which alter it. Obeys "+"/"-" notation,
        indicating advantage/disadvantage on the attack roll. If followed by "other" ("attack other")
        then that means that the attack must target another creature.
    - "Throw": >-
        Make a thrown attack with the weapon. Otherwises treated the same as any other attack If followed
        by range indicator then it overrides previous throw property. (ex: "throw 15ft" for single range,
        or "throw 20/40ft" for a range indicator with a disadvantage range.) Also overrides not having
        a throw property, meaning that if a weapon does not have a default throw range, then it can only
        feasibly be thrown with the given maneuver.
    - "Maneuver": >-
        Make an attack which does not deal damage or requires a block check, only includes an attack roll(Ignores
        "if block", "exploit", "if land", etc.) May be followed by modifiers and properties. Follows "+"/"-"
        notation, indicating advantage/disadvantage on the attack roll.

# CONDITIONALS
"conditionals":
  Description: >-
    A conditional is a single ruleset that, when and if it completes, is followed by ">" and either another
    conditional, an action verb, or modifier. Conditionals can be either combined with "and"(ex: "if strike
    and unshielded > ...") meaning that they must ALL complete in order to complete the segment. Conditionals
    can also be chained with "or"(ex: "if crit or clutch > ...") meaning that if at least one conditional
    completes, segment completes. If a conditional appears with an "on" prefix at the start of a maneuver,
    it means that it can be applied mid-action when another attack with the weapon completes the conditional.
    If a conditional appears with an "if" prefix at the start of a maneuver, it means that it must be
    immediately completable("if unshielded") to a valid target within the range, or within reach of the
    next core word in the sentence.

    A special case exists for a string of conditionals in a sentence or segment that starts with "Per". These
    indicate that the following is executed per conditional that completes. These trigger whenever the conditional does.
  list:
    - "miss": 'Completes when the bound attack misses.'
    - "hit": 'Completes when the bound attack succeeds(attack roll exceeds AC, regardless of block.)'
    - "blocked": 'Completes when the bound attack is blocked.'
    - "strike": >-
        Completes when the bound attack deals damage to a target(even if somehow 0 damage is dealt. This
        means when the block check either fails or is foregone).
    - "crit": 'Completes when the bound attack critically strikes.'
    - "clutch": 'Completes when the bound attack roll results in a nat 1.'
    - "lucky": >-
        Completes when the bound attack has either advantage or disadvantage, and at least one dice results
        in a natural 20.
    - "unlucky": >-
        Completes when the bound attack has either advantage or disadvantage, and at least one dice results
        in a natural 1.
    - "exploit": 'Completes if the target of the bound attack rolls a natural 1 on their block check.'
    - "near": >-
        Completes if the target is within 5ft. Obeys mono "+" notation, increasing distance by 5ft per
        stack.
    - "far": >-
        Completes if the target is beyond 5ft but still within range/reach. Obeys mono "+" notation, increasing
        distance by 5ft per stack.
    - "space": 'Completes if there is at least 5ft of clear empty space between wielder and target.'
    - "heft": >-
        Completes if the target of the maneuver does not choose to spend a reaction to move 5ft in a direction
        of their choice.
    - "unshielded": 'Completes if the target does not possess a shield'
    - "two-handed": 'Completes if the weapon is wielded two-handed.'
    - "one-handed": 'Completes if the weapon is wielded one-handed.'
    - "save": >-
        Completes if the target fails on an associated save(given after the keyword, example: "save DEX")
        vs the weapons block DC. The associated save precedes the save
    - "vs DMG": >-
        Completes if the target fails on an associated save vs the weapons damage dealt. Only triggers
        if "strike" would trigger.
    - "prone": 'Completes if the target is prone.'
    - "advantaged": 'Completes if the attack has advantage.'
    - "disadvantaged": 'Completes if the attack has disadvantage.'
    - "twinned": 'Two weapons of the same kind are wielded.'
    - "free-handed": 'The wielder is holding the weapon in one hand and has the other hand free.'
    - "exposed": 'The target has the "exposed" condition.'
    - "ammo": >-
        Only for "capacity" property weapons. Completes if the capacity is at least equal to the amount
        given after the conditional (ex: "If ammo 2 > Attack > Attack.")
    - "ignited": 'Completes if the weapon is on fire/is ignited, as per the "ignite" property.'

# ACTION VERBS
"action_verbs":
  description: >-
    Action verbs apply to the last core word provided. If none are, or if one appears later in a sequence,
    then it must share the same target as the action verb.
  list:
    - "move": >-
        move self in direction. Directions are [Back, Up, Any] meaning, away from target, towards target,
        in direction of choice. follows mono "+" notation, gaining 5ft of distance per stack.
    - "dash": 'same as move, but no attacks of opportunity.'
    - "push": >-
        same, but move target in outward direction. Requires target size to be equal or smaller to wielder
        in size.
    - "swap": 'swap tiles with the target. Requires target size to be equal or smaller to wielder size.'
    - "pull": 'move target forward. If followed by distance indicator, the distance is overridden by it.'
    - "disarm": 'disarm target of a wielded or held item. The item is dropped.'
    - "apply": 'apply a given condition to the target.'
    # conditions that can be applied are: bleed, dazed, stun, prone, disarm, exposed, on-fire, off-balance, hobbled.
    # (<i><b>Bleed</b>: Stacks up to 6 times, the creature takes 1d3 bleed damage. Amount is increased by 1 dice size category per stack of bleed, up to a max of 1d12</i>)",
    - "dmg": >-
        apply x amount(2s, 1d4b, etc) damage if written with no "+". If written as "dmg +1d6" then it
        increases the damage of the bound attack by the amount, but its delivery still relies on the bound
        attacks seqence (attack roll > block check > dmg.) Damage added or applied by this is not multiplied
        on a critical hit.
    - "miss": 'automatically fail the attack and end the maneuver.'
    - "force-hit": 'set the outcome of the bound attack to be a hit, but not yet blocked(if applicable.)'
    - "force-strike": 'set the outcome of the last attack to hit and not be blocked.'
    - "force-crit": 'set the outcome of the last attack to hit, not be blocked, and be a crit.'
    - "force-reload": 'automatically reload the weapon.'

# MODIFIERS
"modifiers":
  description: ""
  list:
    - "crit range/multi": >-
        The crit range/multiplier of the bound attack is increased by 1(or more, as it follows mono "+"
        notation.)
    - "dice": >-
        The bound attacks damage dice are increased/decreased by 1 dice size category or more. Obeys "+"/"-"
        notation.
    - "ram": >-
        The bound attack gains a +1 bonus to damage and block DC per 5ft traveled since the start of turn
        or last attack(shortest.)
    - "no X": 'negates a property'
    - "block+": 'The bound attacks target has advantage on the block check.'
    - "block-": 'The bound attacks target has disadvantage on the block check.'
    - "block-X": 'The bound attack cannot be blocked.'
    - "nonlethal": 'The bound attacks damage is nonlethal.'
    - "no-reload": 'For ranged attacks. Means the attack has no reload.'
    - "bludgeoning": 'Damage is changed to bludgeoning.'
    - "slashing": 'Damage is changed slashing.'
    - "piercing": 'Damage is changed to piercing.'

#SPECIAL MANEUVERS
"special maneuver operators":
  "To all": >-
    Like a conditional, appears only if multiple attacks are present. Indicates that the following modifiers,
    properties, or actions apply to all previous attacks (ex: "Attack- > if miss > attack > to all > crit
    range+")
  "Self": >-
    Means that the following segment chain applies to the wielder as though they were the target. It applies
    to special constructions such as "Self save STR > heft > attack with block-X"
  "May": 'Indicates that the following segment is optional.'
  "Else": >-
    If it starts a statement(Is the first word) it indicates that it completes the following sentence
    IF the first conditional in the last sentence did not complete. Ex: "attack > If heft > block-. Else
    > block+"
  "OR": >-
    if OR appears at the beginning of a sentence, it indicates that the previous modifier, action, or
    weapon property chain can with the following chain. Ex: "attack > If strike > hook OR disarm"
  "Other": >-
    Only used for starting conditional, meaning that it only triggers when the -other- hand weapons attack
    would complete the conditional. ex: 'If other crIt > attack' means that when the other hands weapon
    crits, this can trigger.
  "Per": >-
    Indicates that the following segment is completed PER conditional. 
    For example "Per crit, exposed, or exploit > dmg +1d4." Would mean that the attack gains a +1d4 bonus to damage 
    when it crits, the defender rolls a nat 1 on a block check, or if the target has the exposed condition. 

